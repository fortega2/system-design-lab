# Observability stack shared by every phase of the lab.
# Each phase includes it with:  include: [../observability/compose.yaml]
#
# No restart policy on purpose: nothing starts with the machine, and a
# container that crashes stays down so the failure is visible.
name: observability # only used when run standalone; ignored when included

networks:
  lab:
    name: lab
  docker-api:
    internal: true
  obs:

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # Read-only gateway to the Docker API for Prometheus and Alloy service
  # discovery and log shipping: only GET on /containers (including logs) and
  # /networks is allowed; any write (stop, kill, exec...) is denied.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      ALLOW_LOGS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run]
    networks: [docker-api]

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [lab, docker-api, obs]
    depends_on: [socket-proxy]

  # Per-container CPU, memory and network. Needs privileged access to the
  # host cgroups, so it is the only service mounting the Docker socket.
  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [lab]

  loki:
    image: grafana/loki:3.7.9
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [lab, obs]

  alloy:
    image: grafana/alloy:v1.21.3
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks: [lab, docker-api]
    depends_on: [loki, socket-proxy]

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      # Local lab only (bound to 127.0.0.1): no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ENFORCE_DOMAIN: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [obs]
    depends_on: [prometheus, loki]
